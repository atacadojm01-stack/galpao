<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atacadão JM - Planta Interativa do Galpão</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #12141c; color: #e1e6ed; padding: 10px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    header { 
      flex-shrink: 0;
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      margin-bottom: 10px; 
      background: #1e222d; 
      padding: 12px 15px; 
      border-radius: 8px; 
      border: 1px solid #2d3345; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
      z-index: 10;
    }
    
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.1rem; color: #fff; }

    /* Barra de Zoom */
    .zoom-bar { display: flex; align-items: center; gap: 4px; background: #12141c; padding: 4px 8px; border-radius: 6px; border: 1px solid #3d455d; }
    .zoom-btn { background: #2d3345; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .zoom-btn:active { background: #3d455d; }
    .zoom-val { font-size: 0.75rem; color: #a4b0be; min-width: 45px; text-align: center; font-weight: bold; }

    /* Busca e Navegação */
    .search-row { display: flex; gap: 6px; width: 100%; align-items: center; }
    .search-box { position: relative; flex: 1; display: flex; }
    .search-box input { 
      width: 100%; 
      padding: 10px 12px; 
      border-radius: 6px; 
      border: 1px solid #3d455d; 
      background: #12141c; 
      color: #fff; 
      font-size: 0.95rem; 
    }
    .search-box input:focus { border-color: #f39c12; outline: none; }

    .nav-busca { display: flex; align-items: center; gap: 4px; background: #12141c; padding: 4px 6px; border-radius: 6px; border: 1px solid #3d455d; }
    .nav-btn { background: #f39c12; color: #12141c; border: none; width: 32px; height: 32px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
    .nav-btn:disabled { background: #2d3345; color: #57606f; cursor: not-allowed; }
    .nav-counter { font-size: 0.75rem; color: #f39c12; font-weight: bold; padding: 0 6px; white-space: nowrap; }

    /* Banner de Recorte */
    .banner-recorte {
      display: none;
      flex-shrink: 0;
      background: #d35400;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border: 1px solid #e67e22;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .banner-recorte button { background: #fff; color: #d35400; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 8px; }

    /* Area do Viewport com Motor de Pan & Zoom Estilo Imagem */
    .mapa-viewport { 
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden; 
      background: #0d0f17;
      border-radius: 8px;
      border: 1px solid #2d3345;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .mapa-viewport.grabbing {
      cursor: grabbing;
    }

    /* Container do Mapa com Transformação 2D */
    .mapa-container { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      width: fit-content;
      transform-origin: 0 0;
      will-change: transform;
    }

    .carreira { background: #1a1d27; border: 1px solid #2d3345; border-radius: 8px; padding: 12px; min-width: 1050px; }
    .carreira-titulo { font-size: 1rem; font-weight: bold; color: #f39c12; margin-bottom: 10px; }
    .modulos-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
    .modulo { background: #222634; border: 1px solid #353c52; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
    .modulo-header { text-align: center; font-size: 0.75rem; font-weight: bold; color: #a4b0be; border-bottom: 1px solid #2d3345; padding-bottom: 4px; }
    .niveis-container { display: flex; flex-direction: column; gap: 4px; }
    .nivel-row { display: flex; flex-direction: column; gap: 2px; background: #181a24; padding: 4px; border-radius: 4px; border: 1px solid #2d3345; }
    .nivel-tag { font-size: 0.6rem; font-weight: bold; color: #00d2d3; margin-bottom: 2px; }
    .nivel-vazio-espaco { height: 54px; background: transparent; border: none; }
    .paletes-split { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    
    /* Cards */
    .slot-box { 
      background: #2a2e3d; 
      border: 1px dashed #4a5064; 
      border-radius: 4px; 
      padding: 4px; 
      height: 48px; 
      overflow: hidden; 
      cursor: pointer; 
      transition: background 0.2s, border 0.2s; 
      position: relative; 
      display: flex;
      flex-direction: column;
    }
    .slot-box:active { background: #353c52; }
    .slot-label { font-size: 0.55rem; color: #747d8c; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; display: block; flex-shrink: 0; }
    
    .produtos-lista { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 2px; 
      overflow: hidden; 
      max-height: 32px; 
    }
    .produto-pill { background: #3c4858; color: #fff; font-size: 0.6rem; padding: 1px 3px; border-radius: 3px; white-space: nowrap; }
    .vazio { color: #57606f; font-style: italic; font-size: 0.6rem; }
    .espacador-coluna { background: transparent; }

    /* Destaques de Busca */
    .slot-box.destaque { background: #5c4710 !important; border: 2px solid #f1c40f !important; }
    .slot-box .produto-pill.destaque-item { background: #e67e22 !important; color: #fff; font-weight: bold; }
    
    .slot-box.foco-ativo { 
      background: #f1c40f !important; 
      border: 3px solid #e67e22 !important; 
      box-shadow: 0 0 18px rgba(241, 196, 15, 1); 
      z-index: 10; 
      animation: pulsoFoco 1s infinite alternate;
    }
    .slot-box.foco-ativo .slot-label { color: #12141c; }
    .slot-box.foco-ativo .produto-pill { background: #12141c; color: #fff; }

    .slot-box.recortado-origem {
      border: 2px dashed #e74c3c !important;
      background: rgba(231, 76, 60, 0.2) !important;
      animation: piscarRecorte 1.2s infinite;
    }

    @keyframes pulsoFoco {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }
    @keyframes piscarRecorte {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Modal */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
    .modal-content { background: #1e222d; padding: 20px; border-radius: 12px; width: 100%; max-width: 460px; border: 1px solid #3d455d; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 8px; color: #f39c12; font-size: 1.1rem; }
    .modal-content p { font-size: 0.85rem; color: #a4b0be; margin-bottom: 8px; }
    
    .text-area-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .btn-voz { background: #2980b9; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-voz.gravando { background: #c0392b; animation: pulsar 1.2s infinite; }
    
    @keyframes pulsar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .modal-content textarea { width: 100%; height: 75px; padding: 10px; background: #12141c; border: 1px solid #3d455d; color: #fff; border-radius: 6px; margin-bottom: 12px; resize: none; font-size: 0.95rem; }
    
    .acoes-recorte-modal { display: flex; gap: 8px; margin-bottom: 15px; }
    .btn-action-cut { flex: 1; background: #d35400; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-action-paste { flex: 1; background: #27ae60; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-save { background: #2ecc71; color: #fff; }
    .btn-cancel { background: #e74c3c; color: #fff; }

    @media (min-width: 600px) {
      header { flex-direction: column; }
      .header-top { flex-direction: row; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Atacadão JM - Planta do Galpão</h1>
      
      <div class="zoom-bar">
        <button class="zoom-btn" onclick="zoomBotao(-0.25)" title="Diminuir Zoom">🔍 -</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button class="zoom-btn" onclick="zoomBotao(0.25)" title="Aumentar Zoom">🔍 +</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Geral (Ver Tudo)" style="margin-left:4px;">👁️ Visão Geral</button>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="inputBusca" placeholder="Pesquisar produto no estoque..." oninput="iniciarBusca()">
      </div>
      <div class="nav-busca">
        <button class="nav-btn" id="btnPrevBusca" onclick="navegarBusca(-1)" disabled title="Anterior">◀</button>
        <span class="nav-counter" id="counterBusca">0/0</span>
        <button class="nav-btn" id="btnNextBusca" onclick="navegarBusca(1)" disabled title="Próximo">▶</button>
      </div>
    </div>
  </header>

  <div class="banner-recorte" id="bannerRecorte">
    <span>✂️ Palete de <strong id="origemRecorteLabel">---</strong> recortado. Clique onde deseja colar!</span>
    <button onclick="cancelarRecorte()">Cancelar</button>
  </div>

  <div class="mapa-viewport" id="mapaViewport">
    <div class="mapa-container" id="mapa"></div>
  </div>

  <div class="modal" id="modalEdicao">
    <div class="modal-content">
      <h3 id="modalTitulo">Editar Palete</h3>
      
      <div class="text-area-header">
        <p style="margin:0;">Produtos:</p>
        <button id="btnVoz" class="btn-voz" onclick="alternarVoz()"> Falar 🎙️ </button>
      </div>
      
      <textarea id="modalProdutos" placeholder="Ex: Fardo Açúcar, Caixa Oleo, Feijão"></textarea>

      <div class="acoes-recorte-modal">
        <button id="btnRecortarModal" class="btn-action-cut" onclick="recortarPalete()">✂️ Recortar Palete</button>
        <button id="btnColarModal" class="btn-action-paste" onclick="colarPalete()" style="display:none;">📋 Colar Aqui</button>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-save" onclick="salvarModal()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCwxEF3IiuXEsIl5s5H9L7R_fBi2ByppDI",
      authDomain: "atacadao-jm-estoque.firebaseapp.com",
      databaseURL: "https://atacadao-jm-estoque-default-rtdb.firebaseio.com",
      projectId: "atacadao-jm-estoque",
      storageBucket: "atacadao-jm-estoque.firebasestorage.app",
      messagingSenderId: "1026908901641",
      appId: "1:1026908901641:web:a8aa76684b5a51ddd2c3d8",
      measurementId: "G-FRENRG40K7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function normalizarTexto(texto) {
      if (!texto) return '';
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, "");
    }

    const dadosCarreiras = [
      { id: 'A', nome: 'Carreira A', modulos: Array.from({ length: 9 }, (_, i) => ({ num: String(i + 1).padStart(2, '0'), niveis: { 3: 'ativo', 2: 'ativo', 1: 'ativo' } })) },
      { id: 'B', nome: 'Carreira B', modulos: [...Array.from({ length: 8 }, (_, i) => ({ num: String(i + 1).padStart(2, '0'), niveis: { 3: 'ativo', 2: (i + 1) === 5 ? 'vazio' : 'ativo', 1: (i + 1) === 5 ? 'vazio' : 'ativo' } })), { tipo: 'espacador', span: 1 }] },
      { id: 'C', nome: 'Carreira C', modulos: [...Array.from({ length: 8 }, (_, i) => ({ num: String(i + 1).padStart(2, '0'), niveis: { 3: 'ativo', 2: (i + 1) === 5 ? 'vazio' : 'ativo', 1: (i + 1) === 5 ? 'vazio' : 'ativo' } })), { tipo: 'espacador', span: 1 }] },
      { id: 'D', nome: 'Carreira D', modulos: [{ num: '01', niveis: { 3: 'ativo', 2: 'vazio', 1: 'vazio' } }, { num: '02', niveis: { 3: 'ativo', 2: 'vazio', 1: 'vazio' } }, { num: '03', niveis: { 3: 'ativo', 2: 'vazio', 1: 'vazio' } }, { tipo: 'espacador', span: 2 }, { num: '04', niveis: { 3: 'ativo', 2: 'ativo', 1: 'ativo' } }, { num: '05', niveis: { 3: 'ativo', 2: 'ativo', 1: 'ativo' } }, { num: '06', niveis: { 3: 'ativo', 2: 'ativo', 1: 'ativo' } }, { num: '07', niveis: { 3: 'ativo', 2: 'vazio', 1: 'vazio' } }] }
    ];

    let estoque = {};
    let slotEdicaoAtual = null;
    let slotEdicaoTitulo = "";
    let recognition = null;

    let resultadosEncontrados = [];
    let indiceBuscaAtual = -1;

    let paleteRecortadoKey = null;
    let paleteRecortadoDados = null;
    let paleteRecortadoTitulo = "";

    // ==========================================
    // MOTOR DE PAN & ZOOM 2D (ESTILO VISUALIZADOR DE IMAGEM)
    // ==========================================
    let scale = 1;
    let pointX = 20;
    let pointY = 20;
    
    let isPointerDown = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let startPointX = 0;
    let startPointY = 0;
    let hasDragged = false;

    let initialPinchDist = 0;
    let initialPinchScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    const viewportEl = document.getElementById('mapaViewport');
    const mapaEl = document.getElementById('mapa');

    function aplicarTransform(animar = false) {
      if (animar) {
        mapaEl.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
      } else {
        mapaEl.style.transition = 'none';
      }
      mapaEl.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      document.getElementById('zoomVal').innerText = `${Math.round(scale * 100)}%`;
    }

    // Zoom concentrado em um ponto focal (mouseX, mouseY)
    function zoomNoPonto(novoScale, mouseX, mouseY, animar = false) {
      const scaleLimitado = Math.max(0.3, Math.min(3.5, novoScale));
      
      const localX = (mouseX - pointX) / scale;
      const localY = (mouseY - pointY) / scale;

      pointX = mouseX - localX * scaleLimitado;
      pointY = mouseY - localY * scaleLimitado;
      scale = scaleLimitado;

      aplicarTransform(animar);
    }

    function zoomBotao(delta) {
      const centroX = viewportEl.clientWidth / 2;
      const centroY = viewportEl.clientHeight / 2;
      zoomNoPonto(scale + delta, centroX, centroY, true);
    }

    function resetZoom() {
      const mapaWidth = mapaEl.offsetWidth || 1100;
      const mapaHeight = mapaEl.offsetHeight || 800;

      const scaleX = (viewportEl.clientWidth - 40) / mapaWidth;
      const scaleY = (viewportEl.clientHeight - 40) / mapaHeight;

      scale = Math.min(1, Math.max(0.35, Math.min(scaleX, scaleY)));

      pointX = Math.max(20, (viewportEl.clientWidth - mapaWidth * scale) / 2);
      pointY = Math.max(20, (viewportEl.clientHeight - mapaHeight * scale) / 2);

      aplicarTransform(true);
    }

    // 1. Zoom via Roda do Mouse (Ponto focal do cursor)
    viewportEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewportEl.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const fator = e.deltaY < 0 ? 1.15 : 0.85;
      zoomNoPonto(scale * fator, mouseX, mouseY, false);
    }, { passive: false });

    // 2. Drag / Mãozinha (Mouse - Desktop)
    viewportEl.addEventListener('mousedown', (e) => {
      if (e.target.closest('.modal')) return;

      isPointerDown = true;
      hasDragged = false;
      viewportEl.classList.add('grabbing');
      
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPointX = pointX;
      startPointY = pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPointerDown) return;

      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;

      if (Math.hypot(dx, dy) > 5) {
        hasDragged = true;
      }

      pointX = startPointX + dx;
      pointY = startPointY + dy;
      aplicarTransform(false);
    });

    window.addEventListener('mouseup', () => {
      if (isPointerDown) {
        isPointerDown = false;
        viewportEl.classList.remove('grabbing');
      }
    });

    // 3. Pinça (Zoom) e Arrasto (Touch - Mobile)
    viewportEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isPointerDown = true;
        hasDragged = false;
        startPointerX = e.touches[0].clientX;
        startPointerY = e.touches[0].clientY;
        startPointX = pointX;
        startPointY = pointY;
      } else if (e.touches.length === 2) {
        isPointerDown = false;
        const rect = viewportEl.getBoundingClientRect();
        const t1 = e.touches[0];
        const t2 = e.touches[1];

        initialPinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        initialPinchScale = scale;

        pinchCenter = {
          x: (t1.clientX + t2.clientX) / 2 - rect.left,
          y: (t1.clientY + t2.clientY) / 2 - rect.top
        };
      }
    }, { passive: true });

    viewportEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPointerDown) {
        const dx = e.touches[0].clientX - startPointerX;
        const dy = e.touches[0].clientY - startPointerY;

        if (Math.hypot(dx, dy) > 5) {
          hasDragged = true;
        }

        pointX = startPointX + dx;
        pointY = startPointY + dy;
        aplicarTransform(false);
      } else if (e.touches.length === 2 && initialPinchDist > 0) {
        if (e.cancelable) e.preventDefault();

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

        const fator = dist / initialPinchDist;
        zoomNoPonto(initialPinchScale * fator, pinchCenter.x, pinchCenter.y, false);
      }
    }, { passive: false });

    viewportEl.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = 0;
      if (e.touches.length === 0) isPointerDown = false;
    }, { passive: true });

    // Reconhecimento de Voz
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcricao = event.results[0][0].transcript;
        const campoTextarea = document.getElementById('modalProdutos');
        if (campoTextarea.value.trim().length > 0) {
          campoTextarea.value += ', ' + transcricao;
        } else {
          campoTextarea.value = transcricao;
        }
        pararVoz();
      };
      recognition.onerror = () => pararVoz();
      recognition.onend = () => pararVoz();
    }

    function alternarVoz() {
      if (!recognition) {
        alert('O seu dispositivo não suporta ditar por voz.');
        return;
      }
      const btn = document.getElementById('btnVoz');
      if (btn.classList.contains('gravando')) {
        recognition.stop();
        pararVoz();
      } else {
        btn.classList.add('gravando');
        btn.innerText = '🔴 Ouvindo...';
        recognition.start();
      }
    }

    function pararVoz() {
      const btn = document.getElementById('btnVoz');
      if (btn) {
        btn.classList.remove('gravando');
        btn.innerText = ' Falar 🎙️ ';
      }
    }

    // Sincronização Firebase
    db.ref('estoque_galpao').on('value', (snapshot) => {
      estoque = snapshot.val() || {};
      renderizarMapa();
      iniciarBusca();
    });

    let mapaInicializado = false;

    function renderizarMapa() {
      const container = document.getElementById('mapa');
      container.innerHTML = '';

      dadosCarreiras.forEach(c => {
        const divCarreira = document.createElement('div');
        divCarreira.className = 'carreira';
        divCarreira.innerHTML = `<div class="carreira-titulo">${c.nome}</div>`;

        const divGrid = document.createElement('div');
        divGrid.className = 'modulos-grid';

        c.modulos.forEach(mod => {
          if (mod.tipo === 'espacador') {
            const divEspacador = document.createElement('div');
            divEspacador.className = 'espacador-coluna';
            if (mod.span) divEspacador.style.gridColumn = `span ${mod.span}`;
            divGrid.appendChild(divEspacador);
            return;
          }

          const divMod = document.createElement('div');
          divMod.className = 'modulo';
          divMod.innerHTML = `<div class="modulo-header">Módulo ${mod.num}</div>`;

          const divNiveis = document.createElement('div');
          divNiveis.className = 'niveis-container';

          [3, 2, 1].forEach(nivelNum => {
            const statusNivel = mod.niveis[nivelNum];
            const divRow = document.createElement('div');

            if (statusNivel === 'ativo') {
              divRow.className = 'nivel-row';
              const nomeNivel = nivelNum === 3 ? 'Alto' : nivelNum === 2 ? 'Meio' : 'Chão';
              
              const divSplit = document.createElement('div');
              divSplit.className = 'paletes-split';

              ['P1', 'P2'].forEach(pSlot => {
                const slotKey = `${c.id}-${mod.num}-N${nivelNum}-${pSlot}`;
                const produtos = estoque[slotKey] || [];
                const pLabel = pSlot === 'P1' ? 'Esq' : 'Dir';
                const tituloCompleto = `${c.id} - Mod ${mod.num} - ${nomeNivel} - Palete ${pLabel}`;

                const divSlot = document.createElement('div');
                divSlot.className = 'slot-box';
                divSlot.id = `slot-${slotKey}`;

                if (paleteRecortadoKey === slotKey) {
                  divSlot.classList.add('recortado-origem');
                }

                // Só abre modal se o usuário não estava arrastando a tela
                divSlot.onclick = () => {
                  if (!hasDragged) abrirModal(slotKey, tituloCompleto);
                };

                let prodHtml = '';
                if (produtos.length > 0) {
                  prodHtml = `<div class="produtos-lista">` + 
                    produtos.map(p => `<span class="produto-pill" data-nome="${normalizarTexto(p)}">${p}</span>`).join('') + 
                    `</div>`;
                } else {
                  prodHtml = `<span class="vazio">Vazio</span>`;
                }

                divSlot.innerHTML = `<span class="slot-label">${pLabel}</span>${prodHtml}`;
                divSplit.appendChild(divSlot);
              });

              divRow.innerHTML = `<span class="nivel-tag">${nomeNivel}</span>`;
              divRow.appendChild(divSplit);
            } else {
              divRow.className = 'nivel-vazio-espaco';
            }

            divNiveis.appendChild(divRow);
          });

          divMod.appendChild(divNiveis);
          divGrid.appendChild(divMod);
        });

        divCarreira.appendChild(divGrid);
        container.appendChild(divCarreira);
      });

      if (!mapaInicializado) {
        setTimeout(() => {
          resetZoom();
          mapaInicializado = true;
        }, 100);
      }
    }

    // Busca Dinâmica com Centralização Automática no Ponto
    function iniciarBusca() {
      const termo = normalizarTexto(document.getElementById('inputBusca').value);

      document.querySelectorAll('.slot-box').forEach(el => el.classList.remove('destaque', 'foco-ativo'));
      document.querySelectorAll('.produto-pill').forEach(el => el.classList.remove('destaque-item'));

      resultadosEncontrados = [];
      indiceBuscaAtual = -1;

      if (termo === '') {
        atualizarContadorBusca();
        return;
      }

      Object.keys(estoque).forEach(key => {
        const produtos = estoque[key];
        const bateu = produtos.some(p => normalizarTexto(p).includes(termo));

        if (bateu) {
          resultadosEncontrados.push(key);
          const slotEl = document.getElementById(`slot-${key}`);
          if (slotEl) {
            slotEl.classList.add('destaque');
            slotEl.querySelectorAll('.produto-pill').forEach(pill => {
              const nomeNormalizado = pill.getAttribute('data-nome');
              if (nomeNormalizado && nomeNormalizado.includes(termo)) {
                pill.classList.add('destaque-item');
              }
            });
          }
        }
      });

      if (resultadosEncontrados.length > 0) {
        indiceBuscaAtual = 0;
        focarResultado(0);
      } else {
        atualizarContadorBusca();
      }
    }

    function navegarBusca(direcao) {
      if (resultadosEncontrados.length === 0) return;
      indiceBuscaAtual += direcao;
      if (indiceBuscaAtual < 0) indiceBuscaAtual = resultadosEncontrados.length - 1;
      if (indiceBuscaAtual >= resultadosEncontrados.length) indiceBuscaAtual = 0;
      focarResultado(indiceBuscaAtual);
    }

    function focarResultado(index) {
      document.querySelectorAll('.slot-box').forEach(el => el.classList.remove('foco-ativo'));
      const key = resultadosEncontrados[index];
      const slotEl = document.getElementById(`slot-${key}`);
      
      if (slotEl) {
        slotEl.classList.add('foco-ativo');

        // Posição do slot relativa ao mapa desescalado
        const slotRect = slotEl.getBoundingClientRect();
        const mapaRect = mapaEl.getBoundingClientRect();

        const slotLocalX = (slotRect.left - mapaRect.left) / scale;
        const slotLocalY = (slotRect.top - mapaRect.top) / scale;
        const slotWidth = slotRect.width / scale;
        const slotHeight = slotRect.height / scale;

        if (scale < 1.0) scale = 1.1; // Ajusta o zoom para visualização nítida se estiver muito longe

        const centroSlotX = slotLocalX + slotWidth / 2;
        const centroSlotY = slotLocalY + slotHeight / 2;

        // Centraliza o slot exatamente no meio do viewport
        pointX = viewportEl.clientWidth / 2 - centroSlotX * scale;
        pointY = viewportEl.clientHeight / 2 - centroSlotY * scale;

        aplicarTransform(true);
      }

      atualizarContadorBusca();
    }

    function atualizarContadorBusca() {
      const btnPrev = document.getElementById('btnPrevBusca');
      const btnNext = document.getElementById('btnNextBusca');
      const counter = document.getElementById('counterBusca');

      if (resultadosEncontrados.length === 0) {
        counter.innerText = '0/0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
      } else {
        counter.innerText = `${indiceBuscaAtual + 1}/${resultadosEncontrados.length}`;
        btnPrev.disabled = false;
        btnNext.disabled = false;
      }
    }

    // Modal, Recortar e Colar
    function abrirModal(key, titulo) {
      slotEdicaoAtual = key;
      slotEdicaoTitulo = titulo;
      document.getElementById('modalTitulo').innerText = titulo;
      const produtos = estoque[key] || [];
      document.getElementById('modalProdutos').value = produtos.join(', ');

      const btnRecortar = document.getElementById('btnRecortarModal');
      const btnColar = document.getElementById('btnColarModal');

      btnRecortar.style.display = produtos.length > 0 ? 'flex' : 'none';

      if (paleteRecortadoKey && paleteRecortadoKey !== key) {
        btnColar.style.display = 'flex';
        btnColar.innerText = `📋 Colar de (${paleteRecortadoKey})`;
      } else {
        btnColar.style.display = 'none';
      }

      document.getElementById('modalEdicao').style.display = 'flex';
    }

    function fecharModal() {
      if (recognition) recognition.stop();
      pararVoz();
      document.getElementById('modalEdicao').style.display = 'none';
      slotEdicaoAtual = null;
    }

    function salvarModal() {
      if (!slotEdicaoAtual) return;
      const val = document.getElementById('modalProdutos').value;
      const itens = val.split(',').map(i => i.trim()).filter(i => i.length > 0);

      if (itens.length > 0) {
        db.ref(`estoque_galpao/${slotEdicaoAtual}`).set(itens);
      } else {
        db.ref(`estoque_galpao/${slotEdicaoAtual}`).remove();
      }

      fecharModal();
    }

    function recortarPalete() {
      if (!slotEdicaoAtual) return;
      const produtos = estoque[slotEdicaoAtual] || [];
      if (produtos.length === 0) return;

      paleteRecortadoKey = slotEdicaoAtual;
      paleteRecortadoDados = [...produtos];
      paleteRecortadoTitulo = slotEdicaoTitulo;

      document.getElementById('origemRecorteLabel').innerText = paleteRecortadoKey;
      document.getElementById('bannerRecorte').style.display = 'flex';

      renderizarMapa();
      fecharModal();
    }

    function colarPalete() {
      if (!slotEdicaoAtual || !paleteRecortadoKey) return;

      const destinoKey = slotEdicaoAtual;
      const produtosDestino = estoque[destinoKey] || [];

      if (produtosDestino.length > 0) {
        const confirma = confirm(`A posição (${destinoKey}) já contém produtos. Deseja substituir pelo conteúdo recortado?`);
        if (!confirma) return;
      }

      db.ref(`estoque_galpao/${destinoKey}`).set(paleteRecortadoDados);
      db.ref(`estoque_galpao/${paleteRecortadoKey}`).remove();

      cancelarRecorte();
      fecharModal();
    }

    function cancelarRecorte() {
      paleteRecortadoKey = null;
      paleteRecortadoDados = null;
      document.getElementById('bannerRecorte').style.display = 'none';
      renderizarMapa();
    }
  </script>
</body>
